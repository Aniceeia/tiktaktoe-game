version: '3.8'

services:
  app:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: game-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://game:password@db:5432/game_db?sslmode=disable
      - PORT=8080
    depends_on:
      - db
    networks: 
      - game-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: game-db
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: password
      POSTGRES_DB: game_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../internal/infrastructure/database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: 
      - game-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks: 
  game-network:
    driver: bridge

